name: collect

on:
  schedule:   # 예비용 — 정시 실행은 cron-job.org가 workflow_dispatch(auto=true)로 호출. 시각만 여기서 바꾸면 됨 — 실행 종류는 시작 시각(KST)으로 판단 (02~06시 정규 / 13~16시 오후 / 22~23시 밤)
    - cron: "17 18 * * *"   # 03:17 KST 정규 수집 (호출 수 기준, ~2시간 → 07:40 추천 전에 끝남)
    - cron: "3 5 * * *"     # 14:03 KST 오후 추가 수집 (16:35 마감) → 16:47 오후 추천에 그날 개찰결과 반영
    - cron: "3 14 * * *"    # 23:03 KST 밤 추가 수집 (23:55 마감)
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠 개찰분"
        default: "3"
      probe:
        description: "응답 구조만 확인 (true/false)"
        default: "false"
      call_limit:
        description: "시험용: 단계별 호출 수 제한 (비우면 기본값)"
        default: ""
      auto:
        description: "예약처럼 실행 (cron-job.org 호출용: 시작 시각으로 정규/추가 판단)"
        default: "false"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          CALL_LIMIT: ${{ inputs.call_limit }}
          EVENT: ${{ github.event_name }}
          AUTO: ${{ inputs.auto }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then
            ARGS="--probe"
          fi
          # 예약 실행은 시작 시각(KST)으로 종류 판단: 정규는 호출 수 기준, 추가 수집은 마감 시각 기준(횟수 제한 없음)
          NOW=$(date +%s); END=""; SUF=""
          if [ "$EVENT" = "schedule" ] && [ -f logs/last_collect_at ] && [ $((NOW - $(cat logs/last_collect_at))) -lt 10800 ]; then
            echo "최근 3시간 안에 수집이 이미 실행됨 — 늦게 온 예약 실행 건너뜀"; exit 0   # 정시 실행은 cron-job.org(auto=true), GitHub 예약은 예비
          fi
          if [ "$EVENT" = "schedule" ] || [ "$AUTO" = "true" ]; then
            case "$(TZ=Asia/Seoul date +%H)" in
              02|03|04|05|06) ;;
              13|14|15|16) END="16:35"; SUF="_evening" ;;   # 16:47 오후 추천 전에 끝
              22|23)    END="23:55"; SUF="_night" ;;
              *) echo "예약 시간대 밖에 시작됨 — 이번 수집 생략"; exit 0 ;;
            esac
          fi
          S1=""; S2=""; S3=""
          if [ -n "$END" ]; then
            S3=$(TZ=Asia/Seoul date -d "today $END" +%s)
            if [ $((S3 - NOW)) -lt 600 ]; then echo "마감($END)까지 10분 미만 — 이번 추가 수집 생략"; exit 0; fi
            S1=$((NOW + (S3 - NOW) / 2)); S2=$((NOW + (S3 - NOW) * 3 / 4))   # 실제 시작 시각 기준: 개찰결과 1/2 · 하한율 1/4 · 군부대 1/4
            export CALL_LIMIT=${CALL_LIMIT:-90000}
            echo "추가 수집: 개찰결과 $(TZ=Asia/Seoul date -d @$S1 +%H:%M) / 하한율 $(TZ=Asia/Seoul date -d @$S2 +%H:%M) / 군부대 $END 마감"
          fi
          mkdir -p logs
          MASK="s/${DATA_GO_KR_KEY}/***/g"
          STOP_AT=$S1 python collect.py $ARGS --days "${{ inputs.days || 3 }}" 2>&1 | sed "$MASK" | tee logs/last_run$SUF.txt || echo "::warning::collect.py 비정상 종료"
          if [ -z "$ARGS" ]; then STOP_AT=$S2 python enrich.py 2>&1 | sed "$MASK" | tee logs/enrich$SUF.txt || echo "::warning::enrich.py 비정상 종료"; fi
          if [ -z "$ARGS" ]; then STOP_AT=$S3 python collect_d2b.py 2>&1 | sed "$MASK" | tee logs/d2b$SUF.txt || echo "::warning::collect_d2b.py 비정상 종료"; fi
          date +%s > logs/last_collect_at
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add logs data 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date +%F_%H%M)"
          for i in 1 2 3; do   # 수집 중 main이 바뀌었으면 받아서 다시 올림 (실패 시 수집분이 버려지지 않게)
            git pull --rebase -X theirs && git push && exit 0
            sleep 15
          done
          exit 1
