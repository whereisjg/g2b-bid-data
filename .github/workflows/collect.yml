name: collect

on:
  # 정해진 회차(정규·아침·오후·밤)는 cron-job.org가 workflow_dispatch(auto=true)로 호출 — 실행 종류는 시작 시각(KST)으로 판단
  schedule:
    - cron: "31 * * * *"   # 매시간 40분 짧은 수집 + 연결 기록(logs/net_health.csv): 어느 시간대에 data.go.kr이 막히는지 확인, 한 회차 실패해도 다음 시간에 보충 (2026-10-23)
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠 개찰분"
        default: "3"
      probe:
        description: "응답 구조만 확인 (true/false)"
        default: "false"
      call_limit:
        description: "시험용: 단계별 호출 수 제한 (비우면 기본값)"
        default: ""
      auto:
        description: "예약처럼 실행 (cron-job.org 호출용: 시작 시각으로 정규/추가 판단)"
        default: "false"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          CALL_LIMIT: ${{ inputs.call_limit }}
          EVENT: ${{ github.event_name }}
          AUTO: ${{ inputs.auto }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then
            ARGS="--probe"
          fi
          # 예약 실행은 시작 시각(KST)으로 종류 판단: 정규는 호출 수 기준, 추가 수집은 마감 시각 기준(횟수 제한 없음)
          NOW=$(date +%s); END=""; SUF=""; S3=""
          mkdir -p logs
          # 연결 확인 1회 (KST 시각, 성공/실패, 걸린 초) → 실패면 이번 회차 생략 (재시도로 12분 버리지 않게)
          H=$(python - <<'PY'
          import os, time, requests
          t = time.time()
          try:
              r = requests.get("https://apis.data.go.kr/1230000/as/ScsbidInfoService/getOpengResultListInfoCnstwk", timeout=20,
                               params={"serviceKey": os.environ["DATA_GO_KR_KEY"], "type": "json", "numOfRows": 1, "inqryDiv": 1, "inqryBgnDt": "202610010000", "inqryEndDt": "202610012359"})
              print("ok" if r.status_code == 200 else f"http{r.status_code}", round(time.time() - t, 1))
          except Exception as e:
              print(type(e).__name__, round(time.time() - t, 1))
          PY
          )
          [ -f logs/net_health.csv ] || echo "kst,event,result,sec" > logs/net_health.csv
          echo "$(TZ=Asia/Seoul date '+%F %H:%M'),$EVENT,$(echo $H | tr ' ' ',')" >> logs/net_health.csv
          echo "연결 확인: $H"
          if [ "${H%% *}" != "ok" ]; then echo "::warning::data.go.kr 연결 안 됨 ($H) — 이번 회차 생략"; exit 0; fi
          if [ "$EVENT" = "schedule" ]; then
            S3=$((NOW + 2400)); SUF="_hourly"   # 매시간: 40분만
          elif [ "$AUTO" = "true" ]; then
            case "$(TZ=Asia/Seoul date +%H)" in
              02|03|04|08|09|10|11) ;;   # 정규 (호출 수 기준). 10/22·23 새벽·밤엔 data.go.kr 연결이 계속 시간 초과 → 08시대 권장
              05|06|07) END="07:35"; SUF="_morning" ;;   # 07:40 아침 추천 전에 그날 개찰결과 보충
              13|14|15|16) END="16:35"; SUF="_evening" ;;   # 16:47 오후 추천 전에 끝
              22|23)    END="23:55"; SUF="_night" ;;
              *) echo "예약 시간대 밖에 시작됨 — 이번 수집 생략"; exit 0 ;;
            esac
          fi
          S1=""; S2=""
          if [ -n "$END" ]; then S3=$(TZ=Asia/Seoul date -d "today $END" +%s); fi
          if [ -n "$S3" ]; then
            if [ $((S3 - NOW)) -lt 600 ]; then echo "마감($END)까지 10분 미만 — 이번 추가 수집 생략"; exit 0; fi
            S1=$((NOW + (S3 - NOW) / 2)); S2=$((NOW + (S3 - NOW) * 3 / 4))   # 실제 시작 시각 기준: 개찰결과 1/2 · 하한율 1/4 · 군부대 1/4
            export CALL_LIMIT=${CALL_LIMIT:-90000}
            echo "추가 수집: 개찰결과 $(TZ=Asia/Seoul date -d @$S1 +%H:%M) / 하한율 $(TZ=Asia/Seoul date -d @$S2 +%H:%M) / 군부대 $END 마감"
          fi
          MASK="s/${DATA_GO_KR_KEY}/***/g"
          # 다가오는 공고 목록 (추천 시각에 연결이 안 되면 추천이 이걸로 계산) — 회차마다 먼저 갱신
          if [ -z "$ARGS" ]; then python upcoming.py 2>&1 | sed "$MASK" | tee logs/upcoming.txt || echo "::warning::upcoming.py 비정상 종료"; fi
          STOP_AT=$S1 python collect.py $ARGS --days "${{ inputs.days || 3 }}" 2>&1 | sed "$MASK" | tee logs/last_run$SUF.txt || echo "::warning::collect.py 비정상 종료"
          if [ -z "$ARGS" ]; then STOP_AT=$S2 python enrich.py 2>&1 | sed "$MASK" | tee logs/enrich$SUF.txt || echo "::warning::enrich.py 비정상 종료"; fi
          if [ -z "$ARGS" ]; then STOP_AT=$S3 python collect_d2b.py 2>&1 | sed "$MASK" | tee logs/d2b$SUF.txt || echo "::warning::collect_d2b.py 비정상 종료"; fi
          date +%s > logs/last_collect_at
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add logs data 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date +%F_%H%M)"
          for i in 1 2 3; do   # 수집 중 main이 바뀌었으면 받아서 다시 올림 (실패 시 수집분이 버려지지 않게)
            git pull --rebase -X theirs && git push && exit 0
            sleep 15
          done
          exit 1
